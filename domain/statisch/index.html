<!doctype html>
<!--
  Kundenlink unter der eigenen Domain: https://www.example.com/unterlagen/?t=<Token>
  Variante für Hoster OHNE PHP (statische Seiten, z. B. Netlify, GitHub Pages, Webflow-Export).
  Ablage auf dem Webserver: /unterlagen/index.html

  Erzeugt mit: node tools/domaindatei.js --statisch (setzt Web-App-Adresse und Firmennamen ein).
  Voraussetzung wie bei der PHP-Fassung: LINK_BASIS in apps-script/Konfig.gs gesetzt und die
  Web-App neu bereitgestellt.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{{FIRMA}} · Unterlagen hochladen</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; font-family: Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { padding: 40px 20px; text-align: center; color: #444; }
</style>
</head>
<body>
<script>
  (function () {
    var ziel = '{{WEBAPP_URL}}';
    var t = new URLSearchParams(window.location.search).get('t') || '';
    if (!/^[A-Za-z0-9]{24,64}$/.test(t)) {
      document.body.innerHTML = '<p>Dieser Link ist unvollständig. Bitte den Link aus der E-Mail vollständig öffnen.</p>';
      return;
    }
    var f = document.createElement('iframe');
    f.src = ziel + '?t=' + encodeURIComponent(t);
    f.title = document.title;          // Firmenname steht schon maskiert im <title>
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.setAttribute('allow', 'camera');
    document.body.appendChild(f);
  })();
</script>
<noscript><p>Bitte JavaScript aktivieren, um Unterlagen hochzuladen.</p></noscript>
</body>
</html>
